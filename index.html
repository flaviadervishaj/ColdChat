<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#08111f" />
  <title>ColdChat</title>
  <link rel="stylesheet" href="/assets/index-DtLo_uuG.css" />
  <style>
    .message.pinned{background:linear-gradient(90deg,#ffd16612,#ffd16605 48%,transparent);box-shadow:inset 2px 0 0 #ffd16666}
    .pin-badge{color:#ffd166;border:1px solid #ffd1663d;background:#ffd1660d;border-radius:999px;padding:2px 6px;font-size:7px;font-style:normal;font-weight:900;letter-spacing:.7px}
    .message-actions button[aria-label="Pin message"],.message-actions button[aria-label="Unpin message"]{font-size:12px}

    /* Message polish */
    .message{padding:6px 8px;gap:8px;transition:background .16s ease,box-shadow .16s ease}
    .message:hover,.message:focus-within{background:#ffffff0a}
    .message-content{min-width:0;padding:2px 4px 4px;border-radius:10px}
    .message-line{width:100%;gap:7px;align-items:center}
    .message-username{max-width:38%}
    .message-text{font-size:14.5px;line-height:1.48;font-weight:590}
    .message-time{display:inline-flex!important;justify-content:flex-end;align-items:flex-end;align-self:flex-end;min-width:42px;margin-left:auto;text-align:right;font-size:8px;line-height:1.2;font-variant-numeric:tabular-nums;opacity:.82}
    .message-actions{border-radius:10px;box-shadow:0 8px 24px #0004}
    .message-actions .quick-reaction{font-size:12px;line-height:1}
    .reactions{gap:5px;margin-top:6px}
    .reactions button{padding:4px 8px}
    .quoted{margin-top:1px;margin-bottom:6px}
    .sticker-message{border-radius:13px}

    /* Composer polish */
    .composer{border-radius:16px;padding:6px 6px 6px 12px}
    .composer textarea{font-size:14px;line-height:1.45}
    .composer-zone{background:#050a1385}

    /* Private chat: focused desktop panel + obvious way back */
    .dm-back-button{height:32px;color:#c8d4e3;border:1px solid var(--line);background:#ffffff07;border-radius:9px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;font-size:9px;font-weight:780}
    .dm-back-button:hover{color:var(--ice);background:#74e9ff0d;border-color:#74e9ff2e}
    .dm-thread{padding-inline:clamp(16px,3vw,34px)}
    .dm-intro{margin:18px auto 14px}
    .dm-bubble{max-width:min(72%,620px);padding:10px 12px 7px}
    .dm-bubble p{font-size:14.5px;line-height:1.48}
    .dm-bubble time{font-size:8px;font-variant-numeric:tabular-nums}

    @media (min-width:761px){
      .conversation-area.private-view{grid-template-columns:minmax(0,920px);justify-content:center}
      .conversation-area.private-view .chat-card{width:100%;box-shadow:0 28px 90px #00000066}
    }

    @media (max-width:760px){
      .message{padding:5px 5px 6px;grid-template-columns:27px minmax(0,1fr) 54px}
      .message-line{width:100%;align-items:flex-end;gap:6px}
      .message-username{max-width:39%;font-size:15.5px}
      .message-text{font-size:14px;line-height:1.46}
      .message-time{display:inline-flex!important;min-width:38px;font-size:8px;margin-left:auto;padding-bottom:2px}
      .message-actions{visibility:visible;opacity:.82;flex-direction:row!important;flex-wrap:wrap;justify-content:center;align-content:flex-start;width:54px;gap:2px;padding:2px}
      .message-actions button{width:23px;height:22px}
      .message-actions .quick-reaction{font-size:11px}
      .dm-back-button{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:11px}
      .dm-back-button span{display:none}
      .conversation-area.private-view .chat-card{width:100%;max-width:none}
      .dm-thread{padding-inline:10px}
      .dm-intro{margin:14px auto 11px}
      .dm-bubble{max-width:82%;padding:9px 11px 7px}
      .composer textarea{font-size:16px}
    }

    @media (max-width:500px){
      .message-time{display:inline-flex!important}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { i as reactFactory, t as reactDomClientFactory } from '/assets/framework-CXnKph_e.js';
    import App from '/coldchat-ui.js?v=20260822-ui-polish-1';

    const React = reactFactory();
    const ReactDOMClient = reactDomClientFactory();
    const root = document.getElementById('root');
    const BRIDGE_KEY = 'coldchat_session_bridge';

    let authUser = null;
    let profile = null;

    function readBridge() {
      try { return JSON.parse(localStorage.getItem(BRIDGE_KEY) || 'null'); }
      catch { return null; }
    }

    function persistBrowserCookies(bridge) {
      if (!bridge?.access_token || !bridge?.refresh_token) return;
      const accessAge = Math.max(60, Number(bridge.expires_in || 3600));
      document.cookie = `cc_access=${encodeURIComponent(bridge.access_token)}; Path=/; Max-Age=${accessAge}; Secure; SameSite=Lax`;
      document.cookie = `cc_refresh=${encodeURIComponent(bridge.refresh_token)}; Path=/; Max-Age=2592000; Secure; SameSite=Lax`;
    }

    async function restoreSessionBridge() {
      const bridge = readBridge();
      if (!bridge?.access_token || !bridge?.refresh_token) return;
      persistBrowserCookies(bridge);
      try {
        const r = await fetch('/standalone/auth/session', {
          method: 'POST',
          credentials: 'include',
          cache: 'no-store',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(bridge)
        });
        if (!r.ok) localStorage.removeItem(BRIDGE_KEY);
      } catch {}
    }

    await restoreSessionBridge();

    try {
      const response = await fetch('/standalone/auth/me', {
        credentials: 'include',
        cache: 'no-store'
      });

      if (response.ok) {
        const data = await response.json();
        authUser = data.authUser || null;
      }

      if (authUser) {
        const profileResponse = await fetch('/standalone/profile', {
          credentials: 'include',
          cache: 'no-store'
        });
        if (profileResponse.ok) {
          const data = await profileResponse.json();
          profile = data.profile || null;
        }
      }
    } catch (error) {
      console.warn('ColdChat auth check failed', error);
    }

    const appAuthUser = authUser && profile ? authUser : null;

    ReactDOMClient.hydrateRoot(
      root,
      React.createElement(App, { authUser: appAuthUser })
    );

    const loginTarget = () => authUser && !profile ? '/login?setup=1' : '/login';

    function textOf(el) {
      return (el?.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function isAuthAction(el) {
      const href = el?.getAttribute?.('href') || '';
      const text = textOf(el);
      return /signin-with-chatgpt|chatgpt\.com|\/auth\/login/i.test(href) ||
             /^(sign in|log in|join|create account)$/i.test(text);
    }

    function isComposer(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      const role = (el.getAttribute?.('role') || '').toLowerCase();
      const placeholder = (el.getAttribute?.('placeholder') || '').toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const editable = el.getAttribute?.('contenteditable') === 'true';

      const textInput = tag === 'textarea' ||
        (tag === 'input' && (!el.type || ['text', 'search'].includes(el.type))) ||
        role === 'textbox' || editable;

      if (!textInput) return false;
      return tag === 'textarea' || editable || /message|chat|write|type|reply/.test(`${placeholder} ${aria}`);
    }

    function isSendAction(el) {
      if (!el) return false;
      const text = textOf(el).toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const title = (el.getAttribute?.('title') || '').toLowerCase();
      return /^(send|post)$/.test(text) || /send message|post message/.test(`${aria} ${title}`);
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest?.('a,button,[role="button"],textarea,input,[role="textbox"],[contenteditable]');
      if (!target) return;

      if (isAuthAction(target)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
        return;
      }

      if ((!authUser || !profile) && (isComposer(target) || isSendAction(target))) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
      }
    }, true);

    document.addEventListener('keydown', (event) => {
      if (authUser && profile) return;
      if (!isComposer(event.target)) return;
      if (event.key === 'Enter' || event.key.length === 1) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
      }
    }, true);
  </script>
</body>
</html>
