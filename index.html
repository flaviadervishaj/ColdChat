<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#08111f" />
  <title>ColdChat</title>
  <link rel="stylesheet" href="/assets/index-DtLo_uuG.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { i as reactFactory, t as reactDomClientFactory } from '/assets/framework-CXnKph_e.js';
    import App from '/assets/chat-shell-BA0J5a0Y.js';

    const React = reactFactory();
    const ReactDOMClient = reactDomClientFactory();
    const root = document.getElementById('root');

    let authUser = null;
    try {
      const response = await fetch('/standalone/auth/me', {
        credentials: 'include',
        cache: 'no-store'
      });
      if (response.ok) {
        const data = await response.json();
        authUser = data.authUser || null;
      }
    } catch (error) {
      console.warn('ColdChat auth check failed', error);
    }

    ReactDOMClient.hydrateRoot(
      root,
      React.createElement(App, { authUser })
    );

    // The recovered frontend still contains its original ChatGPT-site auth link.
    // Route guest sign-in actions to ColdChat's standalone auth instead.
    document.addEventListener('click', (event) => {
      if (authUser) return;
      const target = event.target.closest?.('a,button');
      if (!target) return;

      const href = target.getAttribute?.('href') || '';
      const text = (target.textContent || '').trim();
      const oldAuthLink = href.includes('signin-with-chatgpt') || href.includes('chatgpt.com') || href.includes('/auth/login');
      const signInAction = /^(sign in|join|log in)$/i.test(text) || /sign in/i.test(text);

      if (oldAuthLink || signInAction) {
        event.preventDefault();
        event.stopPropagation();
        window.location.assign('/login');
      }
    }, true);
  </script>
</body>
</html>
