<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#08111f" />
  <title>ColdChat</title>
  <link rel="stylesheet" href="/assets/index-DtLo_uuG.css" />
  <style>
    /* Compact, message-first layout */
    .message{grid-template-columns:28px minmax(0,1fr) 28px;align-items:start;gap:7px;padding:4px 6px;border-radius:10px;transition:background .16s ease,box-shadow .16s ease}
    .message:hover,.message:focus-within{background:#ffffff08}
    .message.pinned{position:sticky;top:4px;z-index:12;background:linear-gradient(90deg,#ffd16610,#ffd16605 48%,transparent),#0b1322f4;box-shadow:inset 2px 0 0 #ffd16666,0 8px 24px #0005;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
    .message-content{position:relative;min-width:0;padding:1px 42px 2px 2px}
    .message-meta{display:flex;align-items:center;gap:6px;min-width:0;min-height:18px;margin-bottom:1px;line-height:1}
    .message-username{max-width:58%;font-size:15px;line-height:18px;font-weight:900}
    .role-badge{align-self:center;line-height:1;padding:2px 5px;font-size:6px;transform:translateY(-.25px)}
    .pin-badge{color:#ffd166;border:1px solid #ffd1662e;background:#ffd1660b;border-radius:999px;padding:2px 5px;font-size:6px;font-style:normal;font-weight:850;letter-spacing:.15px;white-space:nowrap}
    .message-body{display:flex;align-items:flex-start;min-width:0}
    .message-text{font-size:14px;line-height:1.38;font-weight:600}
    .message-time{display:block!important;position:absolute;right:1px;bottom:2px;margin:0!important;min-width:36px;color:#718097;text-align:right;font-size:7px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.82}
    .quoted{margin:1px 0 4px;padding:4px 7px}
    .sticker-message{width:clamp(66px,10vw,88px);height:clamp(66px,10vw,88px);border-radius:12px}
    .voice-message{margin-top:2px}

    /* Existing reactions are compact chips below the message. */
    .reactions{gap:3px;margin-top:3px;padding-right:2px}
    .reactions button{min-height:20px;padding:2px 6px;border-radius:999px;font-size:8px}
    .reactions b{font-size:6.5px}

    /* One subtle trigger replaces the always-visible reaction/action column. */
    .message-actions{visibility:visible!important;position:relative;width:28px;min-width:28px;align-self:start;justify-content:center;border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;opacity:.22;overflow:visible;transition:opacity .15s ease}
    .message:hover .message-actions,.message:focus-within .message-actions,.message-actions:hover,.message-actions:has(details[open]){opacity:1}
    .reaction-menu{position:relative;width:24px}
    .reaction-menu summary{list-style:none;width:24px;height:24px;color:#75839a;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer;user-select:none}
    .reaction-menu summary::-webkit-details-marker{display:none}
    .reaction-menu summary:hover,.reaction-menu[open] summary{color:#d8e1ee;background:#ffffff0b}
    .reaction-popover{display:none;position:absolute;right:calc(100% + 5px);top:-3px;z-index:50;align-items:center;gap:2px;padding:3px;border:1px solid #26364b;background:#0d1727f2;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:10px;box-shadow:0 12px 34px #0009;white-space:nowrap}
    .reaction-menu[open] .reaction-popover{display:flex}
    .reaction-popover button{width:27px!important;height:27px!important;border:0;border-radius:7px;color:#dce5f1;background:transparent;display:grid;place-items:center;font-size:13px;line-height:1}
    .reaction-popover button:hover{background:#ffffff10;color:#fff}
    .reaction-divider{width:1px;height:18px;background:#ffffff16;margin:0 2px}

    /* Composer stays clean and compact. */
    .composer{border-radius:16px;padding:6px 6px 6px 12px}
    .composer textarea{font-size:14px;line-height:1.45}
    .composer-zone{background:#050a1385}

    /* Private chat: focused desktop panel + obvious way back. */
    .dm-back-button{height:32px;color:#c8d4e3;border:1px solid var(--line);background:#ffffff07;border-radius:9px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;font-size:9px;font-weight:780}
    .dm-back-button:hover{color:var(--ice);background:#74e9ff0d;border-color:#74e9ff2e}
    .dm-thread{padding-inline:clamp(16px,3vw,34px)}
    .dm-intro{margin:18px auto 14px}
    .dm-bubble{max-width:min(72%,620px);padding:10px 12px 7px}
    .dm-bubble p{font-size:14.5px;line-height:1.48}
    .dm-bubble time{font-size:8px;font-variant-numeric:tabular-nums}

    /* Profile modal: compact settings card instead of a large onboarding sheet. */
    .modal-card:has(.profile-top){width:min(100%,520px);padding:25px 25px 21px;border-radius:22px;overflow:hidden}
    .modal-card:has(.profile-top) .modal-close{top:12px;right:12px;width:31px;height:31px;border-radius:9px}
    .modal-card:has(.profile-top) .eyebrow{margin:0 0 5px;font-size:7px;letter-spacing:1.8px}
    .modal-card:has(.profile-top) h2{max-width:calc(100% - 44px);font-size:22px;line-height:1.08;letter-spacing:-.55px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .modal-card:has(.profile-top) .modal-copy{margin:6px 0 13px;font-size:8px;line-height:1.4}
    .modal-card:has(.profile-top) .profile-top{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:13px;margin:0 0 13px;padding:11px 12px;border:1px solid var(--line);background:#ffffff06;border-radius:15px}
    .modal-card:has(.profile-top) .avatar-upload{width:58px;align-self:end;position:relative}
    .modal-card:has(.profile-top) .avatar-upload>img{width:56px;height:56px}
    .modal-card:has(.profile-top) .avatar-upload>.avatar{position:relative!important;right:auto!important;bottom:auto!important;width:56px!important;height:56px!important;border:1px solid #ffffff21!important;border-radius:50%!important;box-shadow:inset 0 1px #ffffff14!important}
    .modal-card:has(.profile-top) .avatar-upload>.avatar.avatar-ice{background:linear-gradient(145deg,#2d7891,#163c5d)!important}
    .modal-card:has(.profile-top) .avatar-upload>.avatar.avatar-coral{background:linear-gradient(145deg,#9a4660,#44253d)!important}
    .modal-card:has(.profile-top) .avatar-upload>.avatar.avatar-mint{background:linear-gradient(145deg,#267865,#153b3e)!important}
    .modal-card:has(.profile-top) .avatar-upload>span:not(.avatar){right:-5px;bottom:1px;width:24px;height:24px;border-width:2px;border-radius:8px;z-index:3}
    .modal-card:has(.profile-top) .colour-field{gap:7px}
    .modal-card:has(.profile-top) .colour-field>span,.modal-card:has(.profile-top) .profile-field>span{font-size:7.5px;letter-spacing:.1px}
    .modal-card:has(.profile-top) .colour-grid{display:grid;grid-template-columns:repeat(9,27px);gap:6px;align-items:center}
    .modal-card:has(.profile-top) .colour-grid>button,.modal-card:has(.profile-top) .custom-colour{width:27px;height:27px;border-radius:9px}
    .modal-card:has(.profile-top) .profile-field{gap:5px}
    .modal-card:has(.profile-top) .profile-field input{height:42px;border-radius:11px;padding:0 12px;font-size:10.5px}
    .modal-card:has(.profile-top) .profile-field input:disabled{background:#ffffff05;color:#8090a6;border-color:#ffffff12}
    .modal-card:has(.profile-top) .profile-field small{font-size:7px;margin-top:1px}
    .modal-card:has(.profile-top) .primary-action{height:42px;margin-top:12px;border-radius:11px;font-size:9.5px}
    .modal-card:has(.profile-top) .privacy-note{margin:7px 0 0;font-size:6.5px;opacity:.72}

    @media (min-width:761px){
      .conversation-area.private-view{grid-template-columns:minmax(0,920px);justify-content:center}
      .conversation-area.private-view .chat-card{width:100%;box-shadow:0 28px 90px #00000066}
    }

    @media (max-width:760px){
      .message{grid-template-columns:27px minmax(0,1fr) 24px;gap:6px;padding:4px 5px}
      .message.pinned{top:3px}
      .message-content{padding:1px 34px 2px 1px}
      .message-meta{gap:5px;min-height:18px;margin-bottom:0}
      .message-username{max-width:62%;font-size:15px;line-height:18px}
      .role-badge{font-size:5.5px;padding:2px 4px}
      .pin-badge{font-size:5.5px;padding:2px 4px}
      .message-text{font-size:14px;line-height:1.36}
      .message-time{right:0;bottom:2px;min-width:32px;font-size:6.8px}
      .message-actions{width:24px;min-width:24px;opacity:.28}
      .reaction-menu,.reaction-menu summary{width:22px}
      .reaction-menu summary{height:22px;font-size:14px}
      .reaction-popover{right:calc(100% + 3px);top:-4px;padding:3px}
      .reaction-popover button{width:29px!important;height:29px!important;font-size:14px}
      .reactions{margin-top:2px;gap:3px}
      .reactions button{min-height:19px;padding:2px 5px;font-size:8px}
      .sticker-message{width:78px;height:78px}
      .dm-back-button{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:11px}
      .dm-back-button span{display:none}
      .conversation-area.private-view .chat-card{width:100%;max-width:none}
      .dm-thread{padding-inline:10px}
      .dm-intro{margin:14px auto 11px}
      .dm-bubble{max-width:82%;padding:9px 11px 7px}
      .composer textarea{font-size:16px}

      .modal-backdrop:has(.profile-top){place-items:end center;padding:10px 10px max(10px,env(safe-area-inset-bottom))}
      .modal-card:has(.profile-top){width:100%;max-height:78dvh;padding:20px 18px 17px;border-radius:20px;overflow:auto}
      .modal-card:has(.profile-top) .modal-close{top:10px;right:10px;width:30px;height:30px}
      .modal-card:has(.profile-top) h2{font-size:20px;max-width:calc(100% - 40px)}
      .modal-card:has(.profile-top) .modal-copy{margin:5px 0 11px}
      .modal-card:has(.profile-top) .profile-top{grid-template-columns:50px minmax(0,1fr);gap:11px;padding:10px;margin-bottom:11px;border-radius:14px}
      .modal-card:has(.profile-top) .avatar-upload{width:50px;align-self:end}
      .modal-card:has(.profile-top) .avatar-upload>img{width:48px;height:48px}
      .modal-card:has(.profile-top) .avatar-upload>.avatar{width:48px!important;height:48px!important}
      .modal-card:has(.profile-top) .avatar-upload>span:not(.avatar){width:22px;height:22px;right:-5px;bottom:1px}
      .modal-card:has(.profile-top) .colour-grid{grid-template-columns:repeat(9,25px);gap:5px}
      .modal-card:has(.profile-top) .colour-grid>button,.modal-card:has(.profile-top) .custom-colour{width:25px;height:25px;border-radius:8px}
      .modal-card:has(.profile-top) .profile-field input{height:40px;font-size:10px}
      .modal-card:has(.profile-top) .primary-action{height:40px;margin-top:10px}
      .modal-card:has(.profile-top) .privacy-note{display:none}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { i as reactFactory, t as reactDomClientFactory } from '/assets/framework-CXnKph_e.js';
    import App from '/coldchat-ui.js?v=20260822-profile-pin-fix-3';

    const React = reactFactory();
    const ReactDOMClient = reactDomClientFactory();
    const root = document.getElementById('root');
    const BRIDGE_KEY = 'coldchat_session_bridge';

    let authUser = null;
    let profile = null;

    function readBridge() {
      try { return JSON.parse(localStorage.getItem(BRIDGE_KEY) || 'null'); }
      catch { return null; }
    }

    function persistBrowserCookies(bridge) {
      if (!bridge?.access_token || !bridge?.refresh_token) return;
      const accessAge = Math.max(60, Number(bridge.expires_in || 3600));
      document.cookie = `cc_access=${encodeURIComponent(bridge.access_token)}; Path=/; Max-Age=${accessAge}; Secure; SameSite=Lax`;
      document.cookie = `cc_refresh=${encodeURIComponent(bridge.refresh_token)}; Path=/; Max-Age=2592000; Secure; SameSite=Lax`;
    }

    async function restoreSessionBridge() {
      const bridge = readBridge();
      if (!bridge?.access_token || !bridge?.refresh_token) return;
      persistBrowserCookies(bridge);
      try {
        const r = await fetch('/standalone/auth/session', {
          method: 'POST',
          credentials: 'include',
          cache: 'no-store',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(bridge)
        });
        if (!r.ok) localStorage.removeItem(BRIDGE_KEY);
      } catch {}
    }

    await restoreSessionBridge();

    try {
      const response = await fetch('/standalone/auth/me', {
        credentials: 'include',
        cache: 'no-store'
      });

      if (response.ok) {
        const data = await response.json();
        authUser = data.authUser || null;
      }

      if (authUser) {
        const profileResponse = await fetch('/standalone/profile', {
          credentials: 'include',
          cache: 'no-store'
        });
        if (profileResponse.ok) {
          const data = await profileResponse.json();
          profile = data.profile || null;
        }
      }
    } catch (error) {
      console.warn('ColdChat auth check failed', error);
    }

    const appAuthUser = authUser && profile ? authUser : null;

    ReactDOMClient.hydrateRoot(
      root,
      React.createElement(App, { authUser: appAuthUser })
    );

    const loginTarget = () => authUser && !profile ? '/login?setup=1' : '/login';

    function textOf(el) {
      return (el?.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function isAuthAction(el) {
      const href = el?.getAttribute?.('href') || '';
      const text = textOf(el);
      return /signin-with-chatgpt|chatgpt\.com|\/auth\/login/i.test(href) ||
             /^(sign in|log in|join|create account)$/i.test(text);
    }

    function isComposer(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      const role = (el.getAttribute?.('role') || '').toLowerCase();
      const placeholder = (el.getAttribute?.('placeholder') || '').toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const editable = el.getAttribute?.('contenteditable') === 'true';

      const textInput = tag === 'textarea' ||
        (tag === 'input' && (!el.type || ['text', 'search'].includes(el.type))) ||
        role === 'textbox' || editable;

      if (!textInput) return false;
      return tag === 'textarea' || editable || /message|chat|write|type|reply/.test(`${placeholder} ${aria}`);
    }

    function isSendAction(el) {
      if (!el) return false;
      const text = textOf(el).toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const title = (el.getAttribute?.('title') || '').toLowerCase();
      return /^(send|post)$/.test(text) || /send message|post message/.test(`${aria} ${title}`);
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest?.('a,button,[role="button"],textarea,input,[role="textbox"],[contenteditable]');
      if (!target) return;

      if (isAuthAction(target)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
        return;
      }

      if ((!authUser || !profile) && (isComposer(target) || isSendAction(target))) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
      }
    }, true);

    document.addEventListener('keydown', (event) => {
      if (authUser && profile) return;
      if (!isComposer(event.target)) return;
      if (event.key === 'Enter' || event.key.length === 1) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(loginTarget());
      }
    }, true);
  </script>
</body>
</html>
