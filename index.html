<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#08111f" />
  <title>ColdChat</title>
  <link rel="stylesheet" href="/assets/index-DtLo_uuG.css" />
  <style>
    .message.pinned{background:linear-gradient(90deg,#ffd16612,#ffd16605 48%,transparent);box-shadow:inset 2px 0 0 #ffd16666}
    .pin-badge{color:#ffd166;border:1px solid #ffd1663d;background:#ffd1660d;border-radius:999px;padding:2px 6px;font-size:7px;font-style:normal;font-weight:900;letter-spacing:.7px}
    .message-actions button[aria-label="Pin message"],.message-actions button[aria-label="Unpin message"]{font-size:12px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { i as reactFactory, t as reactDomClientFactory } from '/assets/framework-CXnKph_e.js';
    import App from '/coldchat-ui.js';

    const React = reactFactory();
    const ReactDOMClient = reactDomClientFactory();
    const root = document.getElementById('root');

    let authUser = null;
    let profile = null;

    async function readAuthState() {
      try {
        const authResponse = await fetch('/standalone/auth/me', {
          credentials: 'include',
          cache: 'no-store'
        });
        if (!authResponse.ok) return;
        const authData = await authResponse.json().catch(() => ({}));
        authUser = authData.authUser || null;
        if (!authUser) return;

        // A valid signed-in ColdChat user must also have a profile. Retry once
        // before treating the cookie as stale/incomplete.
        for (let attempt = 0; attempt < 2; attempt++) {
          const profileResponse = await fetch('/standalone/profile', {
            credentials: 'include',
            cache: 'no-store'
          }).catch(() => null);
          if (profileResponse?.ok) {
            const profileData = await profileResponse.json().catch(() => ({}));
            profile = profileData.profile || null;
            if (profile) return;
          }
          if (attempt === 0) await new Promise(resolve => setTimeout(resolve, 180));
        }

        // Never expose an incomplete/stale session to the recovered frontend,
        // because its legacy behavior opens the username modal automatically.
        await fetch('/standalone/auth/logout', {
          method: 'POST',
          credentials: 'include',
          cache: 'no-store'
        }).catch(() => null);
        authUser = null;
        profile = null;
      } catch (error) {
        console.warn('ColdChat auth check failed', error);
        authUser = null;
        profile = null;
      }
    }

    await readAuthState();

    ReactDOMClient.hydrateRoot(
      root,
      React.createElement(App, { authUser: authUser && profile ? authUser : null })
    );

    function textOf(el) {
      return (el?.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function isAuthAction(el) {
      const href = el?.getAttribute?.('href') || '';
      const text = textOf(el);
      return /signin-with-chatgpt|chatgpt\.com|\/auth\/login|\/login/i.test(href) ||
             /^(sign in|log in|join|create account|create profile)$/i.test(text);
    }

    function isComposer(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      const role = (el.getAttribute?.('role') || '').toLowerCase();
      const placeholder = (el.getAttribute?.('placeholder') || '').toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const editable = el.getAttribute?.('contenteditable') === 'true';
      const textInput = tag === 'textarea' ||
        (tag === 'input' && (!el.type || ['text', 'search'].includes(el.type))) ||
        role === 'textbox' || editable;
      if (!textInput) return false;
      return tag === 'textarea' || editable || /message|chat|write|type|reply/.test(`${placeholder} ${aria}`);
    }

    function isSendAction(el) {
      if (!el) return false;
      const text = textOf(el).toLowerCase();
      const aria = (el.getAttribute?.('aria-label') || '').toLowerCase();
      const title = (el.getAttribute?.('title') || '').toLowerCase();
      return /^(send|post)$/.test(text) || /send message|post message/.test(`${aria} ${title}`);
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest?.('a,button,[role="button"],textarea,input,[role="textbox"],[contenteditable]');
      if (!target) return;

      if (!authUser && isAuthAction(target)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign('/login');
        return;
      }

      if (!authUser && (isComposer(target) || isSendAction(target))) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign('/login');
      }
    }, true);

    document.addEventListener('keydown', (event) => {
      if (authUser) return;
      if (!isComposer(event.target)) return;
      if (event.key === 'Enter' || event.key.length === 1) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign('/login');
      }
    }, true);
  </script>
</body>
</html>
