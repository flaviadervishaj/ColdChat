<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta name="theme-color" content="#071018" />
  <title>ColdChat — Sign in</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071018;color:#f5f8ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.card{width:min(420px,100%);background:#0d1822;border:1px solid #213341;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008}.brand{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:6px}.sub{color:#9fb2c2;margin-bottom:22px;line-height:1.5}.google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #29404f;background:#fff;color:#17212b;border-radius:13px;padding:13px 14px;font-weight:800;font-size:15px;cursor:pointer}.google:disabled{opacity:.7;cursor:wait}.gmark{font-size:19px;font-weight:900;color:#4285f4}.divider{display:flex;align-items:center;gap:12px;color:#6f8495;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:#243743;flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#08121a;border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;color:#9fb2c2;padding:11px;border-radius:11px;font-weight:700;cursor:pointer}.tabs button.active{background:#162633;color:#fff}label{display:block;font-size:13px;color:#a9bac8;margin:14px 0 7px}input{width:100%;border:1px solid #29404f;background:#09131b;color:white;border-radius:13px;padding:14px 15px;font-size:16px;outline:none}input:focus{border-color:#74e9ff}button.primary{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;background:#74e9ff;color:#05212a;font-weight:800;font-size:16px;cursor:pointer}button.primary:disabled{opacity:.6;cursor:wait}.msg{min-height:22px;margin-top:14px;font-size:14px;color:#ff9a9a;line-height:1.4}.ok{color:#68f3c0}.back{display:block;text-align:center;margin-top:18px;color:#9fb2c2;text-decoration:none;font-size:14px}.hidden{display:none!important}.setup-note{font-size:13px;color:#8fa6b7;margin-top:-4px;line-height:1.45}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">ColdChat</div>
    <div id="subtitle" class="sub">Sign in to continue to ColdChat.</div>

    <section id="authSection">
      <button class="google" id="googleBtn" type="button"><span class="gmark">G</span>Continue with Google</button>
      <div class="divider">or continue with email</div>
      <div class="tabs"><button type="button" id="signinTab" class="active">Sign in</button><button type="button" id="signupTab">Create account</button></div>
    </section>

    <form id="form">
      <div id="usernameWrap" class="hidden">
        <label for="username">Username</label>
        <input id="username" maxlength="80" autocomplete="nickname" placeholder="Choose a username" />
        <div id="setupNote" class="setup-note hidden">Choose the name people will see in ColdChat.</div>
      </div>

      <div id="emailWrap">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      </div>

      <div id="passwordWrap">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters" />
      </div>

      <button class="primary" id="submit" type="submit">Sign in</button>
      <div id="msg" class="msg"></div>
    </form>
    <a class="back" href="/">← Back to ColdChat</a>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://awtayqyiaorglduxnust.supabase.co';
const SUPABASE_KEY='sb_publishable_3p6Piixdq_bu-wF793Z_fQ_PVpZ6uIv';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{flowType:'pkce',detectSessionInUrl:false,persistSession:true,storageKey:'coldchat-oauth'}
});

let mode='signin';
let currentUser=null;
const $=id=>document.getElementById(id);

function setMessage(text='',ok=false){$('msg').className='msg'+(ok?' ok':'');$('msg').textContent=text;}
function sanitizeSuggestion(email=''){return (email.split('@')[0]||'user').replace(/[^a-zA-Z0-9_.-]/g,'').slice(0,32)||'user';}

function setMode(next){
  mode=next;
  const setup=mode==='setup';
  $('authSection').classList.toggle('hidden',setup);
  $('emailWrap').classList.toggle('hidden',setup);
  $('passwordWrap').classList.toggle('hidden',setup);
  $('usernameWrap').classList.toggle('hidden',mode==='signin');
  $('setupNote').classList.toggle('hidden',!setup);
  $('signinTab').classList.toggle('active',mode==='signin');
  $('signupTab').classList.toggle('active',mode==='signup');
  $('email').required=!setup;
  $('password').required=!setup;
  $('username').required=setup||mode==='signup';
  $('password').autocomplete=mode==='signup'?'new-password':'current-password';
  $('submit').textContent=setup?'Continue to ColdChat':(mode==='signup'?'Create account':'Sign in');
  $('subtitle').textContent=setup?'Finish setting up your ColdChat profile.':'Sign in to continue to ColdChat.';
  setMessage('');
}

$('signinTab').onclick=()=>setMode('signin');
$('signupTab').onclick=()=>setMode('signup');

async function getAuth(){
  const r=await fetch('/standalone/auth/me',{credentials:'include',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  return d.authUser||null;
}
async function getProfile(){
  const r=await fetch('/standalone/profile',{credentials:'include',cache:'no-store'});
  if(!r.ok)return null;
  const d=await r.json().catch(()=>({}));
  return d.profile||null;
}
async function logoutServer(){
  await fetch('/standalone/auth/logout',{method:'POST',credentials:'include',cache:'no-store'}).catch(()=>null);
  currentUser=null;
}
async function createProfile(username){
  const r=await fetch('/standalone/profile',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({username})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Could not create profile.');
  return d.profile;
}
async function saveServerSession(session){
  if(!session?.access_token||!session?.refresh_token)throw new Error('Google session was not returned.');
  const r=await fetch('/standalone/auth/session',{
    method:'POST',credentials:'include',headers:{'content-type':'application/json'},
    body:JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,expires_in:session.expires_in||3600})
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Could not save Google session.');
}

async function showSetup(user){
  currentUser=user;
  setMode('setup');
  if(!$('username').value)$('username').value=sanitizeSuggestion(user?.email||'');
  $('username').focus();
}

$('googleBtn').onclick=async()=>{
  const btn=$('googleBtn');
  btn.disabled=true;
  setMessage('Opening Google…');
  try{
    await logoutServer();
    const {error}=await sb.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo:location.origin+'/login'}
    });
    if(error)throw error;
  }catch(err){
    btn.disabled=false;
    setMessage(err.message||'Google sign in failed.');
  }
};

async function finishGoogleReturn(){
  const query=new URLSearchParams(location.search);
  const oauthError=query.get('error_description')||query.get('error');
  if(oauthError)throw new Error(oauthError);

  const code=query.get('code');
  if(code){
    setMessage('Finishing Google sign in…');
    const {data,error}=await sb.auth.exchangeCodeForSession(code);
    if(error)throw error;
    if(!data?.session)throw new Error('Google sign in did not return a session.');
    await saveServerSession(data.session);
    history.replaceState(null,'','/login');
    return true;
  }

  // Fallback for older implicit OAuth returns.
  const hash=new URLSearchParams(location.hash.slice(1));
  const hashError=hash.get('error_description')||hash.get('error');
  if(hashError)throw new Error(hashError);
  const access_token=hash.get('access_token');
  const refresh_token=hash.get('refresh_token');
  if(access_token&&refresh_token){
    setMessage('Finishing Google sign in…');
    await saveServerSession({access_token,refresh_token,expires_in:Number(hash.get('expires_in')||3600)});
    history.replaceState(null,'','/login');
    return true;
  }
  return false;
}

async function boot(){
  try{
    const googleCompleted=await finishGoogleReturn();

    if(!googleCompleted){
      // Normal visit to /login: stay here and start from a clean server session.
      await logoutServer();
      setMode('signin');
      return;
    }

    currentUser=await getAuth();
    if(!currentUser)throw new Error('Google sign in did not complete. Please try again.');

    const profile=await getProfile();
    if(profile){location.replace('/');return;}
    await showSetup(currentUser);
  }catch(err){
    await logoutServer();
    setMode('signin');
    setMessage(err.message||String(err));
  }
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const submit=$('submit');
  submit.disabled=true;
  setMessage('Please wait…');
  try{
    if(mode==='setup'){
      const username=$('username').value.trim();
      if(!username)throw new Error('Choose a username.');
      await createProfile(username);
      location.replace('/');
      return;
    }

    const email=$('email').value.trim();
    const password=$('password').value;
    const username=$('username').value.trim();
    if(mode==='signup'&&!username)throw new Error('Choose a username.');

    const r=await fetch('/standalone/auth/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({mode,email,password})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'Authentication failed.');

    if(data.needsConfirmation){
      setMessage('Account created. Check your email to confirm it, then sign in.',true);
      setMode('signin');
      return;
    }

    currentUser=data.authUser||await getAuth();
    if(!currentUser)throw new Error('Sign in did not complete. Please try again.');

    if(mode==='signup'){
      await createProfile(username);
      location.replace('/');
      return;
    }

    const profile=await getProfile();
    if(profile){location.replace('/');return;}
    await showSetup(currentUser);
  }catch(err){
    setMessage(err.message||String(err));
  }finally{
    submit.disabled=false;
  }
});

boot();
</script>
</body>
</html>
